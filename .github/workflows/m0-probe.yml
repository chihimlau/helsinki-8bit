name: M0 probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/m0-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-probe-output
          path: m0-output/
